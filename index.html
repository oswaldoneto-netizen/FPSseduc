<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FPS 3D Online</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu">
  <div class="panel">
    <div class="logo">FPS <span>3D</span> ONLINE</div>
    <p>Entre no mapa e encontre outros jogadores.</p>
    <input id="name" maxlength="18" placeholder="Seu nick" value="Player">
    <div class="mode-title">Escolha seus controles</div>
    <div class="modes">
      <button id="pcBtn">🖥️ PC</button>
      <button id="mobileBtn" class="selected">📱 CELULAR</button>
    </div>
    <button id="play" class="play">JOGAR</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="top">
    <div>👥 <span>Online</span> <b id="online">0</b></div>
    <div>⭐ <span>Level</span> <b id="level">1</b></div>
    <div>❤️ <b id="hp">100</b></div>
  </div>
  <div id="crosshair">+</div>
  <div id="feed"></div>
  <div id="board"><h3>🏆 TOP 10 — LEVEL</h3><ol id="leaders"></ol></div>
  <div id="controlsHelp">WASD • MOUSE • CLIQUE</div>
  <div id="weaponName">ASSAULT RIFLE</div>
</div>

<div id="mobile" class="hidden">
  <div id="joy"><div id="knob"></div></div>
  <div id="look"></div>
  <button id="fire">🔫</button>
  <button id="jump">⬆</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
